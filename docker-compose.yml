# BASE COMUN a todos los entornos. El codigo va horneado en la imagen: para
# aplicar cambios hay que reconstruir (--build).
#
# Cada entorno se activa con su archivo de variables, que define proyecto,
# puerto, imagen y como se compila el frontend:
#
#   docker compose --env-file env/prod.compose.env up -d --build
#   make up-prod          (lo mismo, mas corto)
#
# Desarrollo suma docker-compose.dev.yml, que monta el codigo y agrega el
# watcher del frontend. El archivo de entorno lo indica en COMPOSE_FILE.
#
# Los secretos de Laravel NO estan aca: viven en env/.env.<entorno>, que se
# monta como /var/www/.env en runtime (ENV_FILE).

services:
  app:
    image: ${APP_IMAGE:?definir APP_IMAGE en env/<entorno>.compose.env}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # --no-dev en prod; --dev en test/dev (necesitan el Debugbar).
        COMPOSER_FLAGS: ${COMPOSER_FLAGS:---no-dev}
        # Se compilan DENTRO de la imagen (etapa assets de Node).
        MIX_APP: ${MIX_APP:-prod}
        MIX_PVT_URL: ${MIX_PVT_URL:-}
        MIX_RRHH_URL: ${MIX_RRHH_URL:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:?definir APP_PORT}:8080"
    # Para llegar a servicios publicados en el host (Gateway de microservicios).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_CHANNEL: stderr
      # true = barra del Debugbar (test y dev). Requiere imagen con dev deps.
      DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-false}
    volumes:
      - ${ENV_FILE:?definir ENV_FILE}:/var/www/.env:ro
      - app-storage:/var/www/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Limites opcionales: descomentar para acotar el consumo del host.
    # mem_limit: ${APP_MEM_LIMIT:-1g}
    # cpus: ${APP_CPUS:-2}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: las sesiones sobreviven a un reinicio de redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # mem_limit: ${REDIS_MEM_LIMIT:-256m}

  # Worker de la cola: las exportaciones pesadas corren fuera de la peticion.
  # Con 1 contenedor procesa una a la vez; escalar con --scale worker=N.
  worker:
    image: ${APP_IMAGE:?definir APP_IMAGE en env/<entorno>.compose.env}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_FLAGS: ${COMPOSER_FLAGS:---no-dev}
        MIX_APP: ${MIX_APP:-prod}
        MIX_PVT_URL: ${MIX_PVT_URL:-}
        MIX_RRHH_URL: ${MIX_RRHH_URL:-}
    restart: unless-stopped
    working_dir: /var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # umask 022: los archivos que genera el worker tienen que ser legibles por
    # www-data; con el umask por defecto quedan 700.
    command: ["sh", "-c", "umask 022 && exec php artisan queue:work --queue=exports,default --tries=1 --timeout=900 --sleep=3"]
    environment:
      LOG_CHANNEL: stderr
      DEBUGBAR_ENABLED: ${DEBUGBAR_ENABLED:-false}
    volumes:
      - ${ENV_FILE:?definir ENV_FILE}:/var/www/.env:ro
      - app-storage:/var/www/storage
    depends_on:
      - redis
    # Docker manda SIGTERM y espera 10 s por defecto: un Excel de 5 minutos
    # moriria a la mitad. queue:work termina el job en curso y sale.
    stop_grace_period: 16m
    healthcheck:
      # Falla si la cola supera 500 pendientes: el worker no da abasto.
      test: ["CMD-SHELL", "php artisan queue:monitor redis:exports:500 > /dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
    # mem_limit: ${WORKER_MEM_LIMIT:-512m}

volumes:
  app-storage:
  redis-data:
