# TESTING / PRE-PRODUCCION  (override de docker-compose.prod.yml)
#
#   APP_PORT=9014 docker compose -f docker-compose.prod.yml -f docker-compose.test.yml up -d --build
#
# No es una copia: solo cambia lo que diferencia testing de produccion. Todo lo
# demas (servicios, healthchecks, volumenes, worker) sale de docker-compose.prod.yml.
# Si produccion cambia, testing lo hereda automaticamente.
name: pvt-be-test

services:
  app:
    container_name: pvt-be-test
    image: ${APP_IMAGE:-pvt-app:test}
    build:
      # con dependencias de desarrollo: la imagen incluye el Debugbar
      args:
        COMPOSER_FLAGS: ""
    environment:
      # barra del Debugbar visible: identifica que es el entorno de pruebas
      DEBUGBAR_ENABLED: "true"

  redis:
    container_name: pvt-be-test-redis

  worker:
    container_name: pvt-be-test-worker
    image: ${APP_IMAGE:-pvt-app:test}
    build:
      args:
        COMPOSER_FLAGS: ""
    environment:
      DEBUGBAR_ENABLED: "true"
