server {
    listen 8080;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20m;
    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Compresion: app.js pesa 22 MB sin comprimir y se sirve en todas las
    # pantallas. Con gzip baja a ~4 MB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Estaticos: se cachean en el navegador para no re-descargar 22 MB por
    # navegacion. El nombre de los archivos no cambia, asi que 7 dias.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        # expires ya emite Cache-Control: max-age; no hace falta otro header.
        expires 7d;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # El fastcgi_params de la imagen trae HTTP_HOST = $host, que NO incluye
        # el puerto: en :8137 Laravel arma las URLs como http://localhost/... y
        # los formularios y redirects se van al puerto 80.
        # $http_host conserva el puerto. nginx advierte que es el Host crudo del
        # cliente; aca no hay vhosts (server_name _) y en produccion se sirve en
        # 443, donde $http_host y $host coinciden.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # No exponer dotfiles.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
